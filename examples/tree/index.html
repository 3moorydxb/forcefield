<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- an empty data: URI, so a demo page does not log a 404 for a favicon nobody shipped -->
<link rel="icon" href="data:,">
<title>forcefield — hierarchy</title>
<style id="base"></style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { GraphView, Filters, darkTheme, themes } from '../../dist/src/index.js';
import { BASE_CSS, el, makeHud, makeLegend, control, slider, button, checkbox, themeSelect } from '../shared/ui.mjs';
import { makePhysicsPanel } from '../shared/physics-panel.mjs';

document.getElementById('base').textContent = BASE_CSS;
const app = document.getElementById('app');

/**
 * The hierarchy case: a large tree whose coordinates were saved by something
 * else, loaded as a STARTING STATE rather than a final answer.
 *
 * The default, `demo.graph.json`, comes from a SYNTHETIC vault — run
 * `npm run demo:data` locally, or let the Pages workflow do it on deploy. It is
 * `.gitignore`d either way: the adapter is committed, the data it produces
 * never is, and no private notes ship with this repo or this page.
 *
 * Pass `?data=` to point the page at your own vault's export instead. Any
 * folder of markdown whose notes name a parent works — see
 * `examples/adapters/README.md`.
 */
const DATA = new URLSearchParams(location.search).get('data') ?? 'demo.graph.json';

const view = new GraphView({
  container: app,
  theme: darkTheme,
  simulation: { seed: 20260824 },
  canvas: { maxLabels: 140, labelZoom: 0.7 },
});
window.view = view;

const panel = el('div', { class: 'panel' });
const status = el('p', { class: 'status' }, 'loading…');
panel.appendChild(el('h1', {}, 'hierarchy'));
panel.appendChild(el('p', { class: 'sub' }, DATA));
panel.appendChild(status);
app.appendChild(panel);
app.appendChild(makeHud(view));

const res = await fetch(DATA);
if (!res.ok) {
  // No fixture, no fallback, no demo seed. A missing file says so.
  status.textContent = `could not load ${DATA} (${res.status}). Run the adapter first — see examples/adapters/README.md.`;
  throw new Error(`missing ${DATA}`);
}
const data = await res.json();

view.load(data, { fit: true, alpha: 0.4 });

/**
 * Saved coordinates cover only part of this vault. The rest arrive at a random
 * point near the origin, so they are seeded next to whatever they are attached
 * to and left for the simulation to place — which is the whole reason this is a
 * simulation and not a coordinate replay.
 */
const unplaced = data.meta?.unpositioned ?? [];
for (let pass = 0; pass < 6; pass++) {
  for (const id of unplaced) view.graph.seedNearNeighbours(id, 24);
}
view.fit();
view.fitWhenSettled();

/**
 * Count the saved coordinates from the DATA, not from the length of
 * `meta.unpositioned`.
 *
 * That list is only populated when the adapter is given a `--positions` file,
 * so on the synthetic demo — which has no saved coordinates at all — it is
 * empty, and `nodeCount - unplaced.length` read as "2864 with saved positions"
 * about a graph the simulation had just laid out from nothing. The status line
 * was stating the exact opposite of the truth, which is worse than not having
 * one.
 */
const saved = data.nodes.filter((n) => Number.isFinite(n.x) && Number.isFinite(n.y)).length;
status.textContent =
  `${view.graph.nodeCount} nodes · ${view.graph.linkCount} links · ` +
  (saved === 0
    ? 'no saved coordinates, laid out entirely by the simulation'
    : `${saved} with saved positions, ${view.graph.nodeCount - saved} laid out here`);

// ------------------------------------------------------------------ filters
let branchRoot = null;
let depth = Infinity;
let dimMode = false;

function currentFilter() {
  const parts = [];
  if (branchRoot) {
    parts.push(Filters.branch(branchRoot, { direction: 'out', maxDepth: depth }));
  }
  if (search.value.trim()) parts.push(Filters.search(search.value));
  if (hiddenTypes.size) {
    const keep = [...new Set(view.graph.types)].filter((t) => !hiddenTypes.has(t || '(untyped)'));
    parts.push(Filters.ofType(...keep));
  }
  return parts.length === 0 ? null : parts.length === 1 ? parts[0] : Filters.and(...parts);
}

function apply() {
  const f = currentFilter();
  if (dimMode) { view.filter(null); view.highlight(f); }
  else { view.highlight(null); const s = view.filter(f); showing.textContent = `${s.visible} shown`; }
  if (!f) showing.textContent = `${view.graph.nodeCount} shown`;
}

const branchSection = el('section');
branchSection.appendChild(el('h2', {}, 'branch'));
const branchName = el('div', { class: 'hint' }, 'click a node to isolate its subtree');
branchSection.appendChild(branchName);
branchSection.appendChild(el('div', { style: { height: '6px' } }));
branchSection.appendChild(control('depth', slider({
  min: 1, max: 12, step: 1, value: 12,
  onInput: (v) => { depth = v >= 12 ? Infinity : v; apply(); },
})));
branchSection.appendChild(button('whole graph', () => {
  branchRoot = null; branchName.textContent = 'click a node to isolate its subtree'; apply();
}));
panel.appendChild(branchSection);

const search = el('input', { type: 'search', placeholder: 'search labels…' });
search.addEventListener('input', apply);
const showing = el('p', { class: 'status' }, '');
// Live physics — the four controls, matching the graph settings this vault is
// read against. Dragging one reflows the running graph; nothing restarts.
const physicsSection = el('section');
physicsSection.appendChild(el('h2', {}, 'forces'));
const physics = makePhysicsPanel(view, { storageKey: 'forcefield:physics:tree' });
physicsSection.appendChild(physics.box);
panel.appendChild(physicsSection);

const searchSection = el('section');
searchSection.appendChild(el('h2', {}, 'search'));
searchSection.appendChild(search);
searchSection.appendChild(showing);
searchSection.appendChild(checkbox('dim instead of hide', false, (on) => { dimMode = on; apply(); }));
panel.appendChild(searchSection);

const hiddenTypes = new Set();
const legendSection = el('section');
legendSection.appendChild(el('h2', {}, 'node type'));
const legend = makeLegend(view, (label, node) => {
  const off = node.dataset.off === '1';
  node.dataset.off = off ? '0' : '1';
  if (off) hiddenTypes.delete(label); else hiddenTypes.add(label);
  apply();
});
legendSection.appendChild(legend.box);
panel.appendChild(legendSection);

const actions = el('section');
actions.appendChild(el('h2', {}, 'actions'));
actions.appendChild(button('fit', () => view.fit()));
actions.appendChild(button('reheat', () => view.simulation.reheat(0.6)));
actions.appendChild(themeSelect(view, themes, () => legend.rebuild()));
panel.appendChild(actions);

panel.appendChild(el('p', { class: 'hint' }, [
  el('kbd', {}, 'click'), ' isolate subtree · ',
  el('kbd', {}, 'double-click'), ' pin · ',
  el('kbd', {}, 'shift-drag'), ' marquee · scroll to zoom',
]));

view.controller.on('nodeclick', (id) => {
  branchRoot = id;
  branchName.textContent = view.graph.node(id)?.label ?? id;
  apply();
});

apply();
view.start();
</script>
</body>
</html>
